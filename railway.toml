[build]
builder = "NIXPACKS"
buildCommand = "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev && npm ci --include=dev && npm run build"

[deploy]
preDeployCommand = "php artisan migrate --force"
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10