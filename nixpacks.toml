[build]
nixpkgs = ["php82", "composer", "nodejs_20"]

[phases.setup]
cmds = ["cd laravel && composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader"]

[phases.build]
cmds = ["cd laravel && npm ci --include=dev && npm run build"]

[start]
cmd = "cd laravel && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
