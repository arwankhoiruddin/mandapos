[build]
nixpkgs = ["php82", "composer", "nodejs_20"]

[phases.setup]
cmds = ["cd laravel && composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader"]

[phases.build]
cmds = ["cd laravel && npm ci --include=dev && npm run build && npm ci --omit=dev --no-package-lock"]

[start]
cmd = "cd laravel && php artisan serve --host=0.0.0.0 --port=$PORT"
preDeployCommand = "cd laravel && php artisan migrate --force"
healthcheckPath = "/up"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
